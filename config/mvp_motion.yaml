motion:
  mode: sequential_joint
  control_rate_hz: 20.0
  fixed_joint_speed_rad_s: 0.08
  maximum_joint_speed_rad_s: 0.10
  command_timeout_s: 20.0
  use_acceleration_planning: false

grasp:
  pregrasp_height_m: 0.055
  grasp_height_m: 0.015
  lift_height_m: 0.080
  fixed_place_position_base_m: [0.20, -0.10, 0.08]
  fixed_wrist_roll_rad: 0.0

safety:
  use_calibration_joint_limits_only: true
  enable_collision_checking: false
  enable_workspace_path_checking: false
  enable_command_gate: false
  enable_shadow_execution: false
  enable_plan_hash: false
  manual_stop_enabled: true

